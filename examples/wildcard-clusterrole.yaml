# The rule everybody writes once "to unblock the deploy" and nobody removes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-admin
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
# Narrower, still wildcard: every verb on one resource includes delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-owner
  namespace: apps
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["*"]
